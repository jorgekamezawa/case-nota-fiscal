# Grafana local com coletor, Prometheus, Loki e Tempo num container (ADR-0007, F04-NF-12).
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.34.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./observabilidade/grafana/provisionamento/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/gerador-nota-fiscal.yaml:ro
      - ./observabilidade/grafana/dashboards:/otel-lgtm/gerador-nota-fiscal/dashboards:ro
      - ./observabilidade/grafana/alertas:/otel-lgtm/grafana/conf/provisioning/alerting:ro
