name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      # A imagem é gerada em todo PR para quebrar cedo; a publicação no ECR entra com a fase 7.
      - name: Imagem
        run: docker build -t gerador-nota-fiscal:${{ github.sha }} .
