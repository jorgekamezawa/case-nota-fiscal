spring.application.name=gerador-nota-fiscal

# Gestão: só vida e prontidão, sem indicador de sistema externo (F04-NF-01).
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true

# Traces: 100% enviados; a amostragem fica no collector (F04-NF-09).
management.tracing.sampling.probability=1.0

# Duração das requisições com histograma e os limites dos SLOs de latência (F04-NF-06, F04-NF-11).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=800ms,1500ms
management.metrics.distribution.percentiles-histogram.integracao=true

# Sem destino configurado nada é exportado; a exportação de métricas vem ligada no Boot e é desligada aqui (F04-NF-09).
management.otlp.metrics.export.enabled=false

# Log em JSON (ECS) fora do perfil local, com os nomes de campo do ADR-0007 (F04-NF-03).
logging.structured.format.console=ecs
logging.structured.json.rename.traceId=trace_id
logging.structured.json.rename.spanId=span_id

# Virtual threads nas requisições e no consumo das filas: as esperas de I/O não prendem threads do sistema (ADR-0002).
spring.threads.virtual.enabled=true

# Concorrência explícita, porque virtual threads não limitam sozinhas (ADR-0002, E02-NF-07): conexões do SDK da AWS,
# compartilhadas por DynamoDB e SQS, e chamadas simultâneas por sistema acionado (4 sistemas x 20 = 80, abaixo de 100).
aws.http.maximo-de-conexoes=100
fila.concorrencia-por-sistema=20

# Conclusão das integrações com o limite do SLO de 5 minutos no histograma (RFC 6.4, E02-NF-08).
management.metrics.distribution.slo.tarefas.conclusao=5m
