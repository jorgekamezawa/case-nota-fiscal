# Envia os três sinais ao otel-lgtm do compose.yaml (F04-NF-12).
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

# DynamoDB Local e ElasticMQ do compose.yaml, com tabelas e filas criadas na subida (E02-NF-03, E04-NF-05).
aws.regiao=us-east-1
aws.dynamodb.endpoint=http://localhost:8000
aws.sqs.endpoint=http://localhost:9324
infra-local.criar-recursos=true

# Sem Pipe no ambiente local: a reconciliação leva as tarefas às filas com prazos curtos (E02-NF-06). Visibilidade
# curta para as 5 tentativas caberem em cerca de 1 minuto, e medição frequente para os alertas (E02-NF-08).
reconciliacao.intervalo=PT10S
reconciliacao.abertas-ha-mais-de=PT10S
fila.visibilidade=PT10S
medicao.intervalo=PT15S

# true derruba a entrega, para provar que a falha persistente vira alerta (RFC O-06).
simulacao.entrega-fora-do-ar=false
